<title id="title">Layer offsets and a cyclic quotient lattice</title>
<desc id="description">A three-coloured triangular lattice with 50-percent-opacity solid connections only between blue sites. Directly on the central elementary ABC triangle, each side has two offset, parallel black lines in opposite directions, each ending in a single-sided half-arrowhead. The opposing directions are labelled [u] and [-u]. No enlarged inset. The arrows describe projected displacement classes, not three-dimensional contact bonds.</desc>
