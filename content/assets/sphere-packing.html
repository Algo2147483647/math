<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCC · HCP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color-scheme:light}main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));width:100%;height:100%;background:#fff}canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;touch-action:none;background:#fff;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #65758b;outline-offset:-4px}
</style>
</head>
<body>
<main aria-label="上排为多点堆积样本，下排为堆积；左侧 FCC，右侧 HCP；拖动旋转，滚轮缩放">
<canvas id="fcc-cell" tabindex="0" role="img" aria-label="FCC 样本，蓝色七个圆心、红色和绿色各保留中间三个圆心"></canvas>
<canvas id="hcp-cell" tabindex="0" role="img" aria-label="HCP 样本，蓝色七个圆心、红色三个圆心"></canvas>
<canvas id="fcc" tabindex="0" role="img" aria-label="FCC 面心立方堆积，ABCABC 层序，圆心及最近邻虚线"></canvas>
<canvas id="hcp" tabindex="0" role="img" aria-label="HCP 六方最密堆积，ABAB 层序，圆心及最近邻虚线"></canvas>
</main>
<script>
(()=>{
'use strict';
const sqrt3=Math.sqrt(3),height=Math.sqrt(8/3);
const layerColors=['37,99,235','220,38,38','22,153,105'];
function lattice(period){
  const points=[];
  const offsets=[[0,0],[1,1/sqrt3],[0,2/sqrt3]];
  for(let k=0;k<4;k++){
    const [ox,oy]=offsets[k%period];
    for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){
      if(Math.abs(i+j)>2)continue;
      points.push({x:2*i+j+ox,y:sqrt3*j+oy,z:k*height,layer:k%period});
    }
  }
  return geometry(points);
}
function geometry(points){
  const center=points.reduce((s,p)=>({x:s.x+p.x/points.length,y:s.y+p.y/points.length,z:s.z+p.z/points.length}),{x:0,y:0,z:0});
  for(const p of points){p.x-=center.x;p.y-=center.y;p.z-=center.z;}
  const edges=[];
  for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++){
    const a=points[i],b=points[j];
    if(Math.abs(Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)-2)<1e-7)edges.push([i,j]);
  }
  return {points,edges};
}
function withoutTopBlueLayer(points){
  const top=Math.max(...points.filter(p=>p.layer===0).map(p=>p.z));
  return geometry(points.filter(p=>!(p.layer===0&&Math.abs(p.z-top)<1e-8)));
}
function fccCell(){
  const points=[],a=Math.sqrt(2);
  for(let i=0;i<=2;i++)for(let j=0;j<=2;j++)for(let k=0;k<=2;k++){
    if((i+j+k)%2!==0)continue;
    points.push({x:(i-j)*a/Math.sqrt(2),y:(i+j-2*k)*a/Math.sqrt(6),z:(i+j+k)*a/Math.sqrt(3),layer:((i+j+k)/2)%3});
  }
  for(let j=0;j<6;j++){
    const angle=j*Math.PI/3;
    points.push({x:2*Math.cos(angle),y:2*Math.sin(angle),z:0,layer:0});
  }
  const middleColored=new Set([1,2].flatMap(layer=>points.filter(p=>p.layer===layer).sort((a,b)=>(a.x*a.x+a.y*a.y)-(b.x*b.x+b.y*b.y)).slice(0,3)));
  return withoutTopBlueLayer(points.filter(p=>p.layer===0||middleColored.has(p)));
}
function hcpCell(){
  const points=[];
  for(let k=0;k<2;k++){
    for(let j=0;j<6;j++)points.push({x:2*Math.cos(j*Math.PI/3),y:2*Math.sin(j*Math.PI/3),z:2*k*height,layer:0});
  }
  for(let k=0;k<2;k++)points.push({x:0,y:0,z:2*k*height,layer:0});
  for(let j=0;j<3;j++){const angle=Math.PI/6+j*2*Math.PI/3;points.push({x:2/sqrt3*Math.cos(angle),y:2/sqrt3*Math.sin(angle),z:height,layer:1});}
  return withoutTopBlueLayer(points);
}
const views=[{canvas:document.getElementById('fcc-cell'),...fccCell(),graySolid:true},{canvas:document.getElementById('hcp-cell'),...hcpCell(),graySolid:true},{canvas:document.getElementById('fcc'),...lattice(3)},{canvas:document.getElementById('hcp'),...lattice(2)}];
for(const view of views)view.radius=Math.max(...view.points.map(p=>Math.hypot(p.x,p.y,p.z)));
// Use the same world-to-screen scale for both first-row diagrams.
const firstRowRadius=Math.max(views[0].radius,views[1].radius);
views[0].radius=views[1].radius=firstRowRadius;
// Unit quaternions represent orientation without angle limits or Euler singularities.
function multiply(a,b){
  return [a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],
    a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
    a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],
    a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
}
function axisAngle(x,y,z,angle){const s=Math.sin(angle/2);return [x*s,y*s,z*s,Math.cos(angle/2)];}
function rotate(q,p){
  const [x,y,z,w]=q;
  const tx=2*(y*p.z-z*p.y),ty=2*(z*p.x-x*p.z),tz=2*(x*p.y-y*p.x);
  return {x:p.x+w*tx+y*tz-z*ty,y:p.y+w*ty+z*tx-x*tz,z:p.z+w*tz+x*ty-y*tx};
}
function turn(view,dx,dy){
  const distance=Math.hypot(dx,dy);if(!distance)return;
  const delta=axisAngle(-dy/distance,dx/distance,0,distance*.008);
  const q=multiply(delta,view.orientation),norm=Math.hypot(...q);
  view.orientation=q.map(v=>v/norm);
}
for(const view of views)Object.assign(view,{orientation:multiply(axisAngle(1,0,0,Math.PI/2-.56),axisAngle(0,0,1,-.45)),zoom:1});
let frame=0;
function draw(view){
  const {zoom,orientation}=view;
  const canvas=view.canvas,box=canvas.getBoundingClientRect(),w=box.width,h=box.height,dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  const radius=view.radius;
  const scale=Math.min(w,h)*.42/radius*zoom;
  const projected=view.points.map(p=>{
    const rotated=rotate(orientation,p);
    return {x:w/2+rotated.x*scale,y:h/2+rotated.y*scale,depth:rotated.z,layer:p.layer};
  });
  ctx.lineWidth=.9;ctx.setLineDash([4,4]);
  const edges=view.edges.map(([i,j])=>({a:projected[i],b:projected[j]})).sort((a,b)=>(a.a.depth+a.b.depth)-(b.a.depth+b.b.depth));
  for(const {a,b} of edges){
    const t=((a.depth+b.depth)/2/radius+1)/2;
    ctx.setLineDash(a.layer===b.layer||!view.graySolid?[4,4]:[]);
    const color=a.layer===b.layer?layerColors[a.layer]:'73,88,109';
    ctx.strokeStyle=`rgba(${color},${.22+t*.36})`;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.setLineDash([]);
  for(const p of [...projected].sort((a,b)=>a.depth-b.depth)){
    const t=(p.depth/radius+1)/2;
    const r=Math.max(2.5,Math.min(4.5,scale*.10));
    ctx.beginPath();ctx.arc(p.x,p.y,r+1,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=`rgba(${layerColors[p.layer]},${.48+t*.52})`;ctx.fill();
  }
}
function render(){frame=0;views.forEach(draw);}
function schedule(){if(!frame)frame=requestAnimationFrame(render);}
for(const view of views){
  const {canvas}=view;
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;turn(view,e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;schedule();});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>{drag=null;});
  canvas.addEventListener('wheel',e=>{e.preventDefault();view.zoom=Math.max(.5,Math.min(2,view.zoom*Math.exp(-e.deltaY*.001)));schedule();},{passive:false});
  canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();turn(view,e.key==='ArrowLeft'?-12.5:e.key==='ArrowRight'?12.5:0,e.key==='ArrowUp'?-12.5:e.key==='ArrowDown'?12.5:0);schedule();});
}
new ResizeObserver(schedule).observe(document.querySelector('main'));
render();
})();
</script>
</body>
</html>
