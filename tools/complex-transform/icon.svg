    cy="36"
    rx="13"
    ry="19"
    transform="rotate(38 33 36)"
    stroke="#79947c"
    stroke-opacity=".2"
    stroke-width="6"
    filter="url(#shadow)"
  />
  <ellipse
    cx="32"
    cy="31"
    rx="12"
    ry="19"
    transform="rotate(38 32 31)"
    stroke="url(#orbit)"
    stroke-width="7"
  />
  <ellipse
    cx="31.2"
    cy="30"
    rx="11"
    ry="18"
