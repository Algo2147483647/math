<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient
      id="tile"
      x1="9"
      y1="4"
      x2="55"
      y2="61"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#fff" stop-opacity=".96" />
      <stop offset=".48" stop-color="#e3efdf" stop-opacity=".88" />
      <stop offset="1" stop-color="#eef2df" stop-opacity=".95" />
    </linearGradient>
    <linearGradient
      id="orbit"
      x1="16"
      y1="12"
      x2="50"
      y2="51"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#bbdec6" />
      <stop offset=".35" stop-color="#7db79b" />
      <stop offset=".7" stop-color="#5a9478" />
      <stop offset="1" stop-color="#a4bf8e" />
    </linearGradient>
    <linearGradient
      id="shine"
      x1="23"
      y1="16"
      x2="42"
      y2="49"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#fff" />
      <stop offset=".5" stop-color="#e2f6df" stop-opacity=".9" />
      <stop offset="1" stop-color="#fff" stop-opacity=".2" />
    </linearGradient>
    <filter
      id="shadow"
      x="6"
      y="6"
      width="54"
      height="56"
      filterUnits="userSpaceOnUse"
    >
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#tile)" />
  <rect
    x="2.7"
    y="2.7"
    width="58.6"
    height="58.6"
    rx="17.3"
    stroke="#fff"
    stroke-opacity=".95"
    stroke-width="1.4"
  />
  <ellipse
